<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星图 · Individual Map</title>
  <link rel="stylesheet" href="{{ static_url('graph.css') }}">
</head>
<body>
  <div id="graph"></div>

  <div class="left-col">
  <div class="hud top-left">
    <a class="back" href="/">← 素材库</a>
    <h1>✦ 星图</h1>
    <input id="search" type="search" placeholder="搜索节点，回车飞过去" autocomplete="off">
    <div class="legend" id="legend">
      {% for key, k in kinds.items() %}
        <button type="button" class="legend-item" data-kind="{{ key }}" style="--c: {{ k.color }}" title="点击显示/隐藏" hidden><i></i>{{ k.label }}</button>
      {% endfor %}
      {% for key, cat in skill_categories.items() %}
        <span class="legend-item static" data-skillcat="{{ key }}" style="--c: {{ cat.color }}" hidden><i class="diamond"></i>{{ '技能' if not key else '技能·' ~ cat.label }}</span>
      {% endfor %}
      <span class="legend-item static" style="--c: {{ org_color }}"><i class="hex"></i>机构</span>
      <span class="legend-item static" id="legend-relation" style="--c: #ffcf7a" hidden><i class="line"></i>关联</span>
    </div>
  </div>

  <!-- 点亮进度：收集图鉴式的等级徽章，点击跳到对应节点（内容由 graph.js 的 renderAchievements 生成） -->
  <section class="hud achv" id="achv">
    <button type="button" class="achv-head" id="achv-toggle" aria-expanded="true">
      <span>✦ 点亮进度</span><span class="achv-sum" id="achv-sum"></span><i class="chev">⌄</i>
    </button>
    <div class="achv-body" id="achv-body"></div>
  </section>

  <!-- 抽屉把手：点击收起/展开，也可以按住左右拖 -->
  <button type="button" class="drawer-grip" id="drawer-grip" aria-expanded="true" title="收起左栏（可拖动）"></button>
  </div>

  <div class="hud top-right">
    <label class="toggle" title="简洁：平时只显示主干，悬停或选中某个球时才显示它的技能、机构和关联连线">连线
      <select id="linkmode">
        <option value="simple">简洁</option>
        <option value="all">全部</option>
        <option value="noRelation">全部（不含关联）</option>
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="layered"> 时间分层</label>
    <label class="toggle"><input type="checkbox" id="lowfx"> 低特效</label>
    <button type="button" id="reset">重置视角</button>
    <button type="button" id="immersive" title="沉浸模式：隐藏所有面板，只看星图（快捷键 H）" aria-label="沉浸模式">👁</button>
  </div>

  <!-- 沉浸模式下唯一留着的按钮：点它或按 Esc 退出 -->
  <button type="button" class="immersive-exit" id="immersive-exit" title="退出沉浸模式（Esc）" aria-label="退出沉浸模式">👁</button>

  <div class="hud bottom-left hint">左键拖动旋转 · 右键拖动平移 · 滚轮缩放 · 拖动小球牵动网络 · 悬停查看 · 单击聚焦 · H 沉浸模式</div>

  <a class="home-btn" href="/" title="回到素材库主页" aria-label="回到素材库主页">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5.5 9v11h4.5v-6h4v6h4.5V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
  </a>

  <aside id="panel" class="panel" hidden></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <div id="empty" class="empty" hidden>
    <p class="empty-title">星图还没有星星</p>
    <p>去 <a href="/">素材库</a> 记录几条经历，给它们加上技能标签和机构，网络就会长出来。</p>
  </div>

  <script src="{{ static_url('vendor/graph-lib.js') }}"></script>
  <script src="{{ static_url('graph.js') }}"></script>
</body>
</html>
